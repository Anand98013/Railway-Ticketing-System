services:
  mysql:
    image: mysql:8.4
    container_name: railway-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: railway_ticketing
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - railway_mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: railway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - railway_redis:/data

volumes:
  railway_mysql:
  railway_redis:
